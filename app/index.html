<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewCampus</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="assets/estilos.css">
<link rel="stylesheet" href="assets/evaluacion/evaluacion.css">
<link rel="stylesheet" href="assets/calendario/calendario.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
  chtml: { scale: 1.02 },
  startup: {
    // No tipografiamos todo el documento al cargar: los paneles ocultos se
    // medirian mal y el arranque seria lento. Cada panel se procesa al abrirse.
    typeset: false,
    ready: function () {
      window.MathJax.startup.defaultReady();
      document.dispatchEvent(new Event("mathjax-listo"));
    }
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<!-- Primero de todo: trae los datos del usuario del archivo de la PC (ver el script) -->
<script src="assets/datos.js"></script>
<script>
// El menu de materias plegado se aplica antes de dibujar, asi no parpadea.
try { if (localStorage.getItem("apuntes:menu") === "plegado") { document.documentElement.classList.add("menu-plegado"); } } catch (e) {}
// Igual con el contenido centrado (opcional, boton de arriba).
try { if (localStorage.getItem("apuntes:centrado") === "si") { document.documentElement.classList.add("contenido-centrado"); } } catch (e) {}
</script>
</head>
<body>

<div class="app">

  <!-- ==================== BARRA LATERAL ==================== -->
  <aside class="sidebar" id="menu-materias">
    <div class="brand">
      <img class="brand-mark" src="assets/logo.svg" alt="">
      <div class="brand-name">NewCampus</div>
    </div>

    <div class="nav-label">Materias</div>

    <!-- El menu lo dibuja app.js con lo que dice contenido/materias.json.
         Para sumar una materia o una unidad se toca ESE archivo, no este. -->
    <div id="materias"></div>

    <p class="firma">versión 0.24.0-alpha<br>by Abasto Franco</p>
  </aside>

  <!-- Manija para plegar el menu: pegada al borde del menu cuando esta abierto,
       y al borde de la pantalla cuando esta plegado (ver initMenu en app.js). -->
  <button class="menu-btn" id="menu-btn" type="button" aria-controls="menu-materias">
    <span class="menu-btn-glifo" aria-hidden="true">&lsaquo;</span>
  </button>

  <!-- ==================== ZONA PRINCIPAL ==================== -->
  <main class="main">

    <div class="topbar">
      <div class="crumbs">
        <span id="crumb-materia"></span>
        <span>&rsaquo;</span>
        <b id="crumb-unidad"></b>
      </div>
      <div class="topbar-row">
        <div class="tabs">
          <button class="tab" data-tab="teoria">Teoría</button>
          <button class="tab" data-tab="practica">Práctica</button>
          <button class="tab" data-tab="evaluacion">Evaluación</button>
          <button class="tab" data-tab="calendario">Calendario</button>
          <button class="tab" data-tab="ruta">Ruta recomendada</button>
        </div>
        <div class="topbar-acciones">

          <!-- Los tres medidores van juntos en una sola caja y separados entre
               si por una linea: la hora, el rato que llevas y el cronometro.
               El boton de tema queda aparte, que no es un medidor. -->
          <div class="medidores">
            <div class="medidor">
              <span class="medidor-etq">Hora ARG</span>
              <span class="medidor-valor" id="reloj-hora">--:--:--</span>
            </div>

            <div class="medidor">
              <span class="medidor-etq">En la página</span>
              <span class="medidor-valor">
                <span id="reloj-tiempo">00:00:00</span>
                <button class="medidor-btn" id="reloj-reset" type="button"
                        title="Reiniciar el tiempo en la página"
                        aria-label="Reiniciar el tiempo en la página">&#8635;</button>
              </span>
            </div>

            <!-- Lo dibuja assets/cronometro.js: el boton de arrancar y, cuando
                 corre, la cuenta regresiva en ese mismo lugar. -->
            <div class="medidor medidor-crono" id="crono"></div>
          </div>

          <button class="theme-btn centrar-btn" id="centrar-btn" type="button">&#8676; &#8677;</button>
          <button class="theme-btn" id="theme-btn">Modo oscuro</button>
        </div>
      </div>
    </div>

    <div class="content-wrap">

      <aside class="toc-panel" id="toc-panel">
        <button class="toc-toggle" id="toc-toggle" aria-expanded="true">
          <span class="toc-toggle-txt">Indice de la seccion</span>
          <span class="chev">&#9662;</span>
        </button>
        <nav class="toc" id="toc"></nav>
      </aside>

      <!-- Los apuntes NO viven aca: app.js inserta en este div la unidad que
           abris, tomandola de generado/apuntes.js -->
      <div class="content" id="contenido"></div>
    </div>
  </main>
</div>

<!-- Material de catedra: botones flotantes y ventanas de PDF.
     Los botones los arma app.js segun la unidad abierta (ver MATERIAL_CATEDRA). -->
<div class="pdf-lanzador" id="pdf-lanzador" hidden></div>
<div class="pdf-capa" id="pdf-capa"></div>

<script src="assets/app.js"></script>
<!-- Sacar una pestania a otra ventana manteniendola apretada -->
<script src="assets/ventanas.js"></script>
<!-- Cronometro de estudio, al lado del reloj -->
<script src="assets/cronometro.js"></script>
<!-- Evaluacion: parciales y autoevaluaciones (un archivo por responsabilidad) -->
<script src="assets/evaluacion/nucleo.js"></script>
<script src="assets/evaluacion/banco.js"></script>
<script src="assets/evaluacion/formulario.js"></script>
<script src="assets/evaluacion/examen.js"></script>
<script src="assets/evaluacion/informe.js"></script>
<script src="assets/evaluacion/cuestionario.js"></script>
<script src="assets/evaluacion/evaluacion.js"></script>
<!-- Calendario: fechas fijas, fechas del usuario, detalle del dia y las dos vistas -->
<script src="assets/calendario/fechas.js"></script>
<script src="assets/calendario/eventos.js"></script>
<script src="assets/calendario/detalle.js"></script>
<script src="assets/calendario/agenda.js"></script>
<script src="assets/calendario/calendario.js"></script>
<!-- Solo el indice: el contenido de cada unidad llega en su propio archivo
     de generado/ cuando se abre (ver construir.py) -->
<script src="generado/indice.js"></script>
</body>
</html>
